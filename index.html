<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
  ">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container">

        <form id="formulario-pedido">
            <div class="row mt-5">
                <h4>Dados basicos</h4>
            </div>

            <div class="row">
                <div class="col-3">
                    <input class="form-control" id="nome" placeholder="nome" type="text">
                </div>

                <div class="col-5">
                    <input class="form-control" placeholder="sobrenome" type="text">
                </div>

                <div class="col-4">
                    <input class="form-control" placeholder="E-mail" type="email">
                </div>
            </div>

            <div class="row mt-3">
                <h4>Dados da entrega</h4>
            </div>

            <div class="row">
                <div class="col-3 d-flex">
                    <input type="text" class="form-control" placeholder="cep" id="cep">
                    <button id="btn-buscar-cep" type="button" class="btn btn-primary">
                        <i class="bi bi-search"></i>

                        <!-- icone loading bootstrap -->
                        <span class=" d-none spinner-border spinner-border-sm"></span>
                    </button>
                </div>

                <div class="col-7">
                    <input type="text" class="form-control" placeholder="Endereço" id="endereco">
                </div>

                <div class="col-2">
                    <input type="number" class="form-control" placeholder="Numero" id="numero">
                </div>
            </div>

            <button type="submit" class="btn btn-success mt-3">
                Enviar pedido
            </button>

    </div>


    </div>

    </div>

    </form>

    </div>

    <script src="jquery.js"></script>
    <script src="./jquery.mask.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
